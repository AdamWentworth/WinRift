services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: winrift
      CLICKHOUSE_USER: winrift
      CLICKHOUSE_PASSWORD: winrift
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/core/internal/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: winrift
      CLICKHOUSE_USER: winrift
      CLICKHOUSE_PASSWORD: winrift
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - runtime_state:/run/winrift
    depends_on:
      clickhouse:
        condition: service_healthy

  worker:
    profiles:
      - worker
    restart: "no"
    build:
      context: .
      dockerfile: services/core/Dockerfile
    command: ["/winrift-worker"]
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: winrift
      CLICKHOUSE_USER: winrift
      CLICKHOUSE_PASSWORD: winrift
    volumes:
      - runtime_state:/run/winrift
    depends_on:
      clickhouse:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  clickhouse_data:
  runtime_state:
