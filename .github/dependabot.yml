version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
      day: monday
    groups:
      core-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /apps/web/caddy
    schedule:
      interval: weekly
      day: monday
    groups:
      web-server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    groups:
      web-container:
        patterns: ["*"]
    ignore:
      # WinRift deliberately follows even-numbered Node LTS releases.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: monthly
    groups:
      core-container:
        patterns: ["*"]
