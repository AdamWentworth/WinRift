version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
      day: monday
    groups:
      core-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    groups:
      web-container:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: monthly
    groups:
      core-container:
        patterns: ["*"]
