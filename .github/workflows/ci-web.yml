name: ci-web

on:
  pull_request:
  push:
    branches: ["main", "master"]
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-web.yml"
      - ".github/workflows/deploy-web-prod.yml"
      - "ops/prod/docker-compose.yml"
      - "ops/prod/deploy-image-utils.sh"
      - ".dockerignore"
  workflow_dispatch: {}

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Same-Origin Production API
        run: |
          if grep -R -n ':8000\|VITE_API_URL' dist; then
            echo "Production bundle contains a development API reference." >&2
            exit 1
          fi

  web-container-security:
    name: Web container security
    runs-on: ubuntu-latest
    needs: web-quality
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/adamwentworth/winrift-web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Production Web Image
        run: docker build --pull -t winrift-web:ci-${{ github.sha }} -f apps/web/Dockerfile .

      - name: Validate Production Web Container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f winrift-web-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name winrift-web-ci -p 127.0.0.1:18082:8080 winrift-web:ci-${{ github.sha }}
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18082/healthz | grep -q '^ok$'
          curl -fsS http://127.0.0.1:18082/ -o /tmp/winrift-web-root.html
          curl -fsS http://127.0.0.1:18082/champions/Irelia -o /tmp/winrift-web-deep.html
          cmp --silent /tmp/winrift-web-root.html /tmp/winrift-web-deep.html
          grep -q '<div id="root"></div>' /tmp/winrift-web-root.html

          asset_path="$(grep -oE '/assets/[^" ]+\.js' /tmp/winrift-web-root.html | head -1)"
          [[ -n "${asset_path}" ]]
          curl -fsSI "http://127.0.0.1:18082${asset_path}" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsSI http://127.0.0.1:18082/ | grep -qi '^x-content-type-options: nosniff'

      - name: Trivy Filesystem Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            fs \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace/apps/web

      - name: Trivy Image Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            winrift-web:ci-${{ github.sha }}

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --format cyclonedx \
            --output /workspace/winrift-web-image-sbom.cdx.json \
            winrift-web:ci-${{ github.sha }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winrift-web-image-sbom
          path: winrift-web-image-sbom.cdx.json
          if-no-files-found: error

      - name: GHCR Login
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Image To GHCR
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker tag winrift-web:ci-${{ github.sha }} ${IMAGE_REPO}:sha-${{ github.sha }}
          docker tag winrift-web:ci-${{ github.sha }} ${IMAGE_REPO}:latest
          docker push ${IMAGE_REPO}:sha-${{ github.sha }}
          docker push ${IMAGE_REPO}:latest

      - name: GHCR Push Skipped
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "GHCR push skipped for pull request builds."
