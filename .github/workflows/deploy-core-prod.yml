name: deploy-core-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Optional override. Leave blank for normal deploys; production pulls ghcr.io/adamwentworth/winrift-core:latest."
        required: false
        default: ""
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/winrift"
        type: string
      start_worker:
        description: "Start/recreate the collector worker after API health passes"
        required: false
        default: true
        type: boolean
      api_health_url:
        description: "Private health URL reachable from the server runner"
        required: false
        default: "http://127.0.0.1:8000/api/health"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy WinRift Core To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-winrift-core-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/ops/prod/docker-compose.yml"
          ENV_FILE="${DEPLOY_ROOT}/.env"
          SCHEMA_SOURCE="${GITHUB_WORKSPACE}/core/internal/clickhouse/schema.sql"
          SCHEMA_TARGET="${DEPLOY_ROOT}/schema.sql"
          CLICKHOUSE_CONFIG_SOURCE="${GITHUB_WORKSPACE}/ops/clickhouse/config.d"
          CLICKHOUSE_USERS_SOURCE="${GITHUB_WORKSPACE}/ops/clickhouse/users.d"
          CLICKHOUSE_CONFIG_TARGET="${DEPLOY_ROOT}/clickhouse/config.d"
          CLICKHOUSE_USERS_TARGET="${DEPLOY_ROOT}/clickhouse/users.d"
          REFRESH_KEY_SOURCE="${GITHUB_WORKSPACE}/ops/prod/refresh-riot-key.sh"
          REFRESH_KEY_TARGET="${DEPLOY_ROOT}/refresh-riot-key"
          RIOTKEY_SOURCE="${GITHUB_WORKSPACE}/ops/prod/riotkey.sh"
          RIOTKEY_TARGET="${DEPLOY_ROOT}/riotkey"
          REQUIRED_ENV_KEYS="RIOT_API_KEY CLICKHOUSE_PASSWORD CORS_ORIGINS COLLECTOR_PLATFORMS COLLECTOR_CURRENT_PATCH"

          mkdir -p "${DEPLOY_ROOT}" "${DEPLOY_ROOT}/deployments" "${CLICKHOUSE_CONFIG_TARGET}" "${CLICKHOUSE_USERS_TARGET}"

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "Env file not found: ${ENV_FILE}" >&2
            echo "Create it from ops/prod/winrift.env.example on the server and put the real Riot key there." >&2
            exit 1
          fi

          for key in ${REQUIRED_ENV_KEYS}; do
            if ! grep -qE "^${key}=" "${ENV_FILE}"; then
              echo "Required env key missing in ${ENV_FILE}: ${key}" >&2
              exit 1
            fi
          done

          env_value() {
            grep -E "^$1=" "${ENV_FILE}" | tail -1 | cut -d= -f2- || true
          }

          storage_mount="$(env_value WINRIFT_STORAGE_MOUNT)"
          clickhouse_dir="$(env_value WINRIFT_CLICKHOUSE_DATA_DIR)"
          clickhouse_hot_dir="$(env_value WINRIFT_CLICKHOUSE_HOT_DIR)"
          clickhouse_log_dir="$(env_value WINRIFT_CLICKHOUSE_LOG_DIR)"
          clickhouse_backup_dir="$(env_value WINRIFT_CLICKHOUSE_BACKUP_DIR)"
          runtime_dir="$(env_value WINRIFT_RUNTIME_STATE_DIR)"
          storage_mount="${storage_mount:-/mnt/storage}"
          clickhouse_dir="${clickhouse_dir:-${storage_mount}/clickhouse/data}"
          clickhouse_hot_dir="${clickhouse_hot_dir:-${storage_mount}/clickhouse/hot}"
          clickhouse_log_dir="${clickhouse_log_dir:-${storage_mount}/clickhouse/logs}"
          clickhouse_backup_dir="${clickhouse_backup_dir:-${storage_mount}/clickhouse/backups}"
          runtime_dir="${runtime_dir:-${DEPLOY_ROOT}/runtime}"

          if ! findmnt "${storage_mount}" >/dev/null 2>&1; then
            echo "Storage mount is not mounted: ${storage_mount}" >&2
            echo "Refusing to start ClickHouse so Docker does not create database files on the OS disk." >&2
            exit 1
          fi

          case "${clickhouse_dir}" in
            "${storage_mount}"/*) ;;
            *)
              echo "WINRIFT_CLICKHOUSE_DATA_DIR must live under ${storage_mount}: ${clickhouse_dir}" >&2
              exit 1
              ;;
          esac

          case "${clickhouse_hot_dir}" in
            "${storage_mount}"/*) ;;
            *)
              echo "WINRIFT_CLICKHOUSE_HOT_DIR must live under ${storage_mount}: ${clickhouse_hot_dir}" >&2
              exit 1
              ;;
          esac

          mkdir -p "${clickhouse_dir}" "${clickhouse_hot_dir}" "${clickhouse_log_dir}" "${clickhouse_backup_dir}" "${runtime_dir}"
          docker run --rm -v "${clickhouse_hot_dir}:/target" alpine sh -c 'chown 101:101 /target && chmod 755 /target'

          install -m 0644 "${COMPOSE_FILE}" "${DEPLOY_ROOT}/docker-compose.yml"
          cp "${SCHEMA_SOURCE}" "${SCHEMA_TARGET}"
          find "${CLICKHOUSE_CONFIG_TARGET}" -type f -name '*.xml' -delete
          find "${CLICKHOUSE_USERS_TARGET}" -type f -name '*.xml' -delete
          cp "${CLICKHOUSE_CONFIG_SOURCE}"/*.xml "${CLICKHOUSE_CONFIG_TARGET}/"
          cp "${CLICKHOUSE_USERS_SOURCE}"/*.xml "${CLICKHOUSE_USERS_TARGET}/"
          install -m 0755 "${REFRESH_KEY_SOURCE}" "${REFRESH_KEY_TARGET}"
          install -m 0755 "${RIOTKEY_SOURCE}" "${RIOTKEY_TARGET}"

          install_shortcut() {
            local target="$1"
            if install -m 0755 "${RIOTKEY_SOURCE}" "${target}" 2>/dev/null; then
              echo "Installed Riot key shortcut: ${target}"
              return 0
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              if sudo install -m 0755 "${RIOTKEY_SOURCE}" "${target}" 2>/dev/null; then
                echo "Installed Riot key shortcut with sudo: ${target}"
                return 0
              fi
            fi
            return 1
          }

          if ! install_shortcut /usr/local/bin/riotkey; then
            mkdir -p "${HOME}/.local/bin"
            install -m 0755 "${RIOTKEY_SOURCE}" "${HOME}/.local/bin/riotkey"
            echo "Installed Riot key shortcut: ${HOME}/.local/bin/riotkey"
            echo "If 'riotkey' is not found in an interactive SSH shell, add ${HOME}/.local/bin to PATH or run ${HOME}/.local/bin/riotkey."
          fi

          docker compose \
            --project-directory "${DEPLOY_ROOT}" \
            -f "${COMPOSE_FILE}" \
            --env-file "${ENV_FILE}" \
            config >/dev/null

      - name: GHCR Login
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy API, Monitor, And Worker
        shell: bash
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/ops/prod/deploy-image-utils.sh"

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/ops/prod/docker-compose.yml"
          ENV_FILE="${DEPLOY_ROOT}/.env"
          IMAGE_REPO="ghcr.io/adamwentworth/winrift-core"
          RAW_IMAGE_INPUT="${{ inputs.image_ref }}"
          TARGET_IMAGE="$(resolve_image_ref "${IMAGE_REPO}" "${RAW_IMAGE_INPUT}")"
          TARGET_DIGEST=""
          DEPLOY_IMAGE=""
          CONTAINER_NAME="winrift_api"
          HEALTH_URL="${{ inputs.api_health_url }}"
          HEALTH_BODY_FILE="/tmp/winrift_api_health_body.txt"
          START_WORKER="${{ inputs.start_worker }}"

          compose() {
            env WINRIFT_CORE_IMAGE="${DEPLOY_IMAGE}" docker compose \
              --project-directory "${DEPLOY_ROOT}" \
              -f "${COMPOSE_FILE}" \
              --env-file "${ENV_FILE}" \
              "$@"
          }

          wait_for_clickhouse() {
            local status=""
            for _ in $(seq 1 36); do
              status="$(docker inspect --format '{{.State.Health.Status}}' winrift_clickhouse 2>/dev/null || true)"
              if [[ "${status}" == "healthy" ]]; then
                return 0
              fi
              sleep 5
            done
            echo "ClickHouse did not become healthy. Last status: ${status}" >&2
            docker logs --tail 200 winrift_clickhouse || true
            return 1
          }

          prepare_rollback_image "${IMAGE_REPO}" "winrift-api" "${CONTAINER_NAME}"

          echo "Pulling target image: ${TARGET_IMAGE}"
          docker pull "${TARGET_IMAGE}"
          select_deploy_image "${TARGET_IMAGE}" "${IMAGE_REPO}"

          echo "Stopping worker before API deploy so collection is quiet during replacement."
          compose stop worker || true

          echo "Starting ClickHouse."
          compose up -d --no-build clickhouse
          wait_for_clickhouse

          echo "Deploying API with image ${DEPLOY_IMAGE}"
          compose up -d --no-deps --force-recreate --no-build api

          HEALTH_OK=0
          LAST_STATUS="000"
          rm -f "${HEALTH_BODY_FILE}"

          for _ in $(seq 1 30); do
            LAST_STATUS="$(curl -sS -o "${HEALTH_BODY_FILE}" -w '%{http_code}' "${HEALTH_URL}" || true)"
            if [[ "${LAST_STATUS}" == "200" ]]; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [[ "${HEALTH_OK}" -ne 1 ]]; then
            echo "New API deployment failed health checks (last status: ${LAST_STATUS})." >&2
            echo "Last API health response body:" >&2
            cat "${HEALTH_BODY_FILE}" 2>/dev/null || true
            echo "Recent API logs:" >&2
            docker logs --tail 200 winrift_api || true

            ROLLBACK_TARGET="${ROLLBACK_IMAGE:-${PREVIOUS_IMAGE}}"
            if [[ -n "${ROLLBACK_TARGET}" ]]; then
              echo "Rolling back API to ${ROLLBACK_TARGET}"
              DEPLOY_IMAGE="${ROLLBACK_TARGET}"
              compose up -d --no-deps --force-recreate --no-build api
            fi
            exit 1
          fi

          if [[ "${START_WORKER}" == "true" ]]; then
            echo "Starting worker with image ${DEPLOY_IMAGE}"
            compose up -d --no-deps --force-recreate --no-build worker
            sleep 8
            WORKER_STATUS="$(docker inspect --format '{{.State.Status}}' winrift_worker 2>/dev/null || true)"
            if [[ "${WORKER_STATUS}" != "running" ]]; then
              echo "Worker did not stay running. Status: ${WORKER_STATUS}" >&2
              docker logs --tail 200 winrift_worker || true
              exit 1
            fi
          else
            echo "Worker start skipped by workflow input."
          fi

          echo "Starting monitor with image ${DEPLOY_IMAGE}"
          compose up -d --no-deps --force-recreate --no-build monitor

          write_deploy_metadata \
            "${DEPLOY_ROOT}/deployments/core.json" \
            "winrift-core" \
            "${RAW_IMAGE_INPUT}" \
            "${TARGET_IMAGE}" \
            "${TARGET_DIGEST}" \
            "${DEPLOY_IMAGE}" \
            "${CONTAINER_NAME}" \
            "${PREVIOUS_IMAGE}" \
            "${PREVIOUS_IMAGE_ID}" \
            "${ROLLBACK_IMAGE}"

          rm -f "${HEALTH_BODY_FILE}"
          echo "Deployment succeeded."

      - name: Post-Deploy Smoke Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          ENV_FILE="${DEPLOY_ROOT}/.env"
          HEALTH_URL="${{ inputs.api_health_url }}"
          START_WORKER="${{ inputs.start_worker }}"
          API_BASE="${HEALTH_URL%/api/health}"
          if [[ "${API_BASE}" == "${HEALTH_URL}" ]]; then
            API_BASE="http://127.0.0.1:8000"
          fi

          env_value() {
            grep -E "^$1=" "${ENV_FILE}" | tail -1 | cut -d= -f2- || true
          }

          assert_container_running() {
            local container_name="$1"
            local label="$2"
            local status=""
            status="$(docker inspect --format '{{.State.Status}}' "${container_name}" 2>/dev/null || true)"
            if [[ "${status}" != "running" ]]; then
              echo "${label} is not running. Status: ${status}" >&2
              docker logs --tail 120 "${container_name}" || true
              exit 1
            fi
            echo "${label}: running"
          }

          smoke_json_endpoint() {
            local label="$1"
            local url="$2"
            local body_file="/tmp/winrift_${label}_body.json"
            local header_file="/tmp/winrift_${label}_headers.txt"
            local status=""

            status="$(curl -sS -o "${body_file}" -D "${header_file}" -w '%{http_code}' "${url}" || true)"
            if [[ "${status}" != "200" ]]; then
              echo "${label} smoke failed with HTTP ${status}: ${url}" >&2
              cat "${body_file}" >&2 || true
              exit 1
            fi

            if command -v python3 >/dev/null 2>&1; then
              python3 -m json.tool "${body_file}" >/dev/null
            fi

            echo "${label}: HTTP 200"
          }

          smoke_cached_endpoint() {
            local label="$1"
            local url="$2"
            local first_body="/tmp/winrift_${label}_first_body.json"
            local first_headers="/tmp/winrift_${label}_first_headers.txt"
            local second_body="/tmp/winrift_${label}_second_body.json"
            local second_headers="/tmp/winrift_${label}_second_headers.txt"
            local status=""

            status="$(curl -sS -o "${first_body}" -D "${first_headers}" -w '%{http_code}' "${url}" || true)"
            if [[ "${status}" != "200" ]]; then
              echo "${label} warmup failed with HTTP ${status}: ${url}" >&2
              cat "${first_body}" >&2 || true
              exit 1
            fi

            status="$(curl -sS -o "${second_body}" -D "${second_headers}" -w '%{http_code}' "${url}" || true)"
            if [[ "${status}" != "200" ]]; then
              echo "${label} cache check failed with HTTP ${status}: ${url}" >&2
              cat "${second_body}" >&2 || true
              exit 1
            fi

            if ! grep -qi '^x-winrift-cache:[[:space:]]*hit' "${second_headers}"; then
              echo "${label} cache check did not return X-WinRift-Cache: hit on the second request." >&2
              echo "Second response headers:" >&2
              cat "${second_headers}" >&2 || true
              exit 1
            fi

            if command -v python3 >/dev/null 2>&1; then
              python3 -m json.tool "${second_body}" >/dev/null
            fi

            echo "${label}: cache hit verified"
          }

          assert_container_running winrift_api API
          assert_container_running winrift_monitor Monitor
          if [[ "${START_WORKER}" == "true" ]]; then
            assert_container_running winrift_worker Worker
          else
            echo "Worker check skipped because start_worker=false."
          fi

          smoke_json_endpoint health "${HEALTH_URL}"
          smoke_cached_endpoint leaderboard "${API_BASE}/api/summoners/leaderboard?platform=NA1&limit=10"

          if command -v python3 >/dev/null 2>&1; then
            PROFILE_QUERY="$(
              python3 - <<'PY'
          import json
          from pathlib import Path
          body = Path("/tmp/winrift_leaderboard_second_body.json").read_text()
          data = json.loads(body)
          for row in data.get("results", []):
              game_name = str(row.get("gameName", "")).strip()
              tag_line = str(row.get("tagLine", "")).strip()
              platform = str(row.get("platform", "")).strip()
              if game_name and tag_line and platform:
                  from urllib.parse import urlencode
                  print(urlencode({"gameName": game_name, "tagLine": tag_line, "platform": platform}))
                  break
          PY
            )"
            if [[ -n "${PROFILE_QUERY}" ]]; then
              smoke_cached_endpoint profile "${API_BASE}/api/summoner/profile?${PROFILE_QUERY}"
            else
              echo "Profile cache smoke skipped: leaderboard returned no usable summoner identity."
            fi
          else
            echo "Profile cache smoke skipped: python3 is unavailable for safe JSON parsing."
          fi

          runtime_dir="$(env_value WINRIFT_RUNTIME_STATE_DIR)"
          runtime_dir="${runtime_dir:-${DEPLOY_ROOT}/runtime}"
          worker_refresh_status_path="$(env_value WORKER_REFRESH_STATUS_PATH)"
          worker_refresh_status_path="${worker_refresh_status_path:-/run/winrift/worker-refresh-status.json}"
          if [[ "${worker_refresh_status_path}" == /run/winrift/* ]]; then
            refresh_status_file="${runtime_dir}/${worker_refresh_status_path#/run/winrift/}"
          else
            refresh_status_file="${worker_refresh_status_path}"
          fi

          readable_refresh_status_file=""
          if [[ -r "${refresh_status_file}" ]]; then
            readable_refresh_status_file="${refresh_status_file}"
          elif [[ -f "${refresh_status_file}" ]]; then
            echo "Refresh status file exists but is not host-readable: ${refresh_status_file}"
            if docker cp "winrift_worker:${worker_refresh_status_path}" - 2>/dev/null \
              | tar -xO > /tmp/winrift_worker_refresh_status.json; then
              readable_refresh_status_file="/tmp/winrift_worker_refresh_status.json"
            else
              echo "Refresh status file could not be read through the worker container either."
            fi
          else
            echo "Refresh status file not found yet: ${refresh_status_file}"
          fi

          if [[ -n "${readable_refresh_status_file}" ]]; then
            if command -v python3 >/dev/null 2>&1; then
              python3 -m json.tool "${readable_refresh_status_file}" >/dev/null
              python3 - "${readable_refresh_status_file}" <<'PY'
          import json
          import sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          print("Refresh status file: readable")
          refreshes = data.get("refreshes", [])
          if not isinstance(refreshes, list):
              refreshes = [lane for lane in data.values() if isinstance(lane, dict)]
          def clean_time(value):
              value = str(value or "")
              if not value or value.startswith("0001-01-01"):
                  return ""
              return value
          for lane in refreshes:
              if not isinstance(lane, dict):
                  continue
              name = lane.get("name") or "unknown"
              success = clean_time(lane.get("lastSucceededAt") or lane.get("last_success_at")) or "never"
              failure = clean_time(lane.get("lastFailedAt") or lane.get("last_failure_at"))
              duration = lane.get("lastDurationMs") or lane.get("last_duration_ms") or ""
              error = lane.get("lastError") or lane.get("last_error") or ""
              detail = f"  {name}: success={success}"
              if duration:
                  detail += f" duration_ms={duration}"
              if failure:
                  detail += f" failure={failure}"
              if error:
                  detail += f" error={error}"
              print(detail)
          PY
            else
              echo "Refresh status file exists and was read from: ${readable_refresh_status_file}"
            fi
          fi

          echo "Deployment smoke checks passed."
