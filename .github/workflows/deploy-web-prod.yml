name: deploy-web-prod

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Optional override. Leave blank for ghcr.io/adamwentworth/winrift-web:latest."
        required: false
        default: ""
        type: string
      deploy_root:
        description: "Absolute path to the prod deploy state root"
        required: false
        default: "/srv/winrift"
        type: string
      site_base_url:
        description: "Server-local URL used for health, deep-route, and browser gates"
        required: false
        default: "http://127.0.0.1:8082"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy WinRift Web To Prod
    runs-on: [self-hosted, linux, x64, prod]
    environment: production
    concurrency:
      group: deploy-winrift-web-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight Checks
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          ENV_FILE="${DEPLOY_ROOT}/.env"
          COMPOSE_SOURCE="${GITHUB_WORKSPACE}/ops/prod/docker-compose.yml"

          if [[ ! -f "${ENV_FILE}" ]]; then
            echo "Env file not found: ${ENV_FILE}" >&2
            exit 1
          fi
          if ! docker inspect winrift_api >/dev/null 2>&1; then
            echo "winrift_api is not deployed; deploy the core before the web application." >&2
            exit 1
          fi

          mkdir -p "${DEPLOY_ROOT}" "${DEPLOY_ROOT}/deployments"
          install -m 0644 "${COMPOSE_SOURCE}" "${DEPLOY_ROOT}/docker-compose.yml"
          docker compose \
            --project-directory "${DEPLOY_ROOT}" \
            -f "${COMPOSE_SOURCE}" \
            --env-file "${ENV_FILE}" \
            config >/dev/null

      - name: GHCR Login
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy Web
        shell: bash
        run: |
          set -euo pipefail

          source "${GITHUB_WORKSPACE}/ops/prod/deploy-image-utils.sh"

          DEPLOY_ROOT="${{ inputs.deploy_root }}"
          COMPOSE_FILE="${GITHUB_WORKSPACE}/ops/prod/docker-compose.yml"
          ENV_FILE="${DEPLOY_ROOT}/.env"
          IMAGE_REPO="ghcr.io/adamwentworth/winrift-web"
          RAW_IMAGE_INPUT="${{ inputs.image_ref }}"
          TARGET_IMAGE="$(resolve_image_ref "${IMAGE_REPO}" "${RAW_IMAGE_INPUT}")"
          TARGET_DIGEST=""
          DEPLOY_IMAGE=""
          CONTAINER_NAME="winrift_web"
          SITE_BASE_URL="${{ inputs.site_base_url }}"

          compose() {
            env WINRIFT_WEB_IMAGE="${DEPLOY_IMAGE}" docker compose \
              --project-directory "${DEPLOY_ROOT}" \
              -f "${COMPOSE_FILE}" \
              --env-file "${ENV_FILE}" \
              "$@"
          }

          prepare_rollback_image "${IMAGE_REPO}" "winrift-web" "${CONTAINER_NAME}"

          echo "Pulling target image: ${TARGET_IMAGE}"
          docker pull "${TARGET_IMAGE}"
          select_deploy_image "${TARGET_IMAGE}" "${IMAGE_REPO}"

          echo "Deploying web with image ${DEPLOY_IMAGE}"
          compose up -d --no-deps --force-recreate --no-build web

          HEALTH_OK=0
          for _ in $(seq 1 30); do
            if curl -fsS "${SITE_BASE_URL}/healthz" >/dev/null; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [[ "${HEALTH_OK}" -ne 1 ]]; then
            echo "New web deployment failed health checks." >&2
            docker logs --tail 200 "${CONTAINER_NAME}" || true
            ROLLBACK_TARGET="${ROLLBACK_IMAGE:-${PREVIOUS_IMAGE}}"
            if [[ -n "${ROLLBACK_TARGET}" ]]; then
              echo "Rolling back web to ${ROLLBACK_TARGET}"
              DEPLOY_IMAGE="${ROLLBACK_TARGET}"
              compose up -d --no-deps --force-recreate --no-build web
            fi
            exit 1
          fi

          write_deploy_metadata \
            "${DEPLOY_ROOT}/deployments/web.json" \
            "winrift-web" \
            "${RAW_IMAGE_INPUT}" \
            "${TARGET_IMAGE}" \
            "${TARGET_DIGEST}" \
            "${DEPLOY_IMAGE}" \
            "${CONTAINER_NAME}" \
            "${PREVIOUS_IMAGE}" \
            "${PREVIOUS_IMAGE_ID}" \
            "${ROLLBACK_IMAGE}"

      - name: Production Web Smoke Checks
        shell: bash
        run: |
          set -euo pipefail

          SITE_BASE_URL="${{ inputs.site_base_url }}"
          ROOT_BODY="${RUNNER_TEMP}/winrift-web-root.html"
          DEEP_BODY="${RUNNER_TEMP}/winrift-web-deep.html"
          API_BODY="${RUNNER_TEMP}/winrift-web-api-health.json"

          [[ "$(docker inspect --format '{{.State.Status}}' winrift_web)" == "running" ]]
          curl -fsS "${SITE_BASE_URL}/healthz" | grep -q '^ok$'
          curl -fsS "${SITE_BASE_URL}/" -o "${ROOT_BODY}"
          curl -fsS "${SITE_BASE_URL}/champions/Irelia" -o "${DEEP_BODY}"
          curl -fsS "${SITE_BASE_URL}/api/health" -o "${API_BODY}"

          grep -q '<div id="root"></div>' "${ROOT_BODY}"
          cmp --silent "${ROOT_BODY}" "${DEEP_BODY}"
          python3 -m json.tool "${API_BODY}" >/dev/null
          grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' "${API_BODY}"

          ASSET_PATH="$(grep -oE '/assets/[^" ]+\.js' "${ROOT_BODY}" | head -1)"
          if [[ -z "${ASSET_PATH}" ]]; then
            echo "Could not find the production JavaScript asset in index.html." >&2
            exit 1
          fi
          curl -fsSI "${SITE_BASE_URL}${ASSET_PATH}" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          echo "Production web smoke checks passed."

      - name: Set Up Browser Gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Browser Gate Dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install chromium

      - name: Strict Deployed Route Gate
        working-directory: apps/web
        env:
          WINRIFT_ROUTE_PERF_BASE_URL: ${{ inputs.site_base_url }}
          WINRIFT_ROUTE_PERF_SKIP_SERVER: "1"
          WINRIFT_ROUTE_PERF_STRICT: "1"
          WINRIFT_ROUTE_PERF_JSON: ${{ runner.temp }}/winrift-web-route-performance.json
        run: npm run perf:routes

      - name: Upload Route Performance Report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winrift-web-route-performance
          path: ${{ runner.temp }}/winrift-web-route-performance.json
          if-no-files-found: ignore
