name: ci-core

on:
  pull_request:
  push:
    branches: ["main", "master"]
    paths:
      - "core/**"
      - "ops/clickhouse/**"
      - "ops/prod/**"
      - ".github/workflows/ci-core.yml"
      - ".dockerignore"
  workflow_dispatch: {}

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-quality:
    name: Core quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: core/go.sum

      - name: Validate GitHub Actions
        working-directory: .
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Test
        run: go test ./...

      - name: Formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "${files}" ]]; then
            echo "The following Go files need gofmt:" >&2
            echo "${files}" >&2
            exit 1
          fi

      - name: Test Production Performance Audit
        working-directory: .
        run: python3 -m unittest discover -s ops/prod/tests -p 'test_*.py'

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: govulncheck ./...

  core-container-security:
    name: Core container security
    runs-on: ubuntu-latest
    needs: core-quality
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/adamwentworth/winrift-core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Container Image
        run: |
          docker build --pull \
            --build-arg "WINRIFT_BUILD_SHA=${GITHUB_SHA}" \
            -t "winrift-core:ci-${GITHUB_SHA}" \
            -f core/Dockerfile \
            .

      - name: Verify Image Identity And Deployment Assets
        run: |
          set -euo pipefail
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "winrift-core:ci-${GITHUB_SHA}")
          [[ "${revision}" == "${GITHUB_SHA}" ]]
          container=$(docker create "winrift-core:ci-${GITHUB_SHA}")
          trap 'docker rm "${container}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/usr/share/winrift/deployment/schema.sql" /tmp/winrift-schema.sql
          docker cp "${container}:/usr/share/winrift/deployment/champion-page-perf-audit.py" /tmp/champion-page-perf-audit.py
          docker cp "${container}:/usr/share/winrift/deployment/perf-smoke.sh" /tmp/perf-smoke.sh
          [[ -s /tmp/winrift-schema.sql ]]
          python3 -m py_compile /tmp/champion-page-perf-audit.py
          bash -n /tmp/perf-smoke.sh

      - name: Validate Production Compose
        run: |
          trap 'rm -f ops/prod/.env' EXIT
          cp ops/prod/winrift.env.example ops/prod/.env
          docker compose --project-directory ops/prod -f ops/prod/docker-compose.yml --env-file ops/prod/winrift.env.example config >/dev/null

      - name: Trivy Filesystem Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            fs \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace/core

      - name: Trivy Image Scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            winrift-core:ci-${{ github.sha }}

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.65.0 \
            image \
            --format cyclonedx \
            --output /workspace/winrift-core-image-sbom.cdx.json \
            winrift-core:ci-${{ github.sha }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winrift-core-image-sbom
          path: winrift-core-image-sbom.cdx.json
          if-no-files-found: error

      - name: GHCR Login
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Image To GHCR
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker tag "winrift-core:ci-${{ github.sha }}" "${IMAGE_REPO}:sha-${{ github.sha }}"
          docker tag "winrift-core:ci-${{ github.sha }}" "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:sha-${{ github.sha }}"
          docker push "${IMAGE_REPO}:latest"

      - name: GHCR Push Skipped
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "GHCR push skipped for pull request builds."

  request-production-deployment:
    name: Request private HomeOps core deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.HOMEOPS_AUTO_DEPLOY == 'true'
    needs: core-container-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Dispatch approved revision to HomeOps
        env:
          HOMEOPS_DISPATCH_TOKEN: ${{ secrets.HOMEOPS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEOPS_DISPATCH_TOKEN}" ]]; then
            echo "HOMEOPS_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi
          payload=$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            '{event_type:"deploy-winrift-core",client_payload:{repository:$repository,sha:$sha,component:"core"}}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${HOMEOPS_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AdamWentworth/HomeOps/dispatches \
            --data "${payload}"
