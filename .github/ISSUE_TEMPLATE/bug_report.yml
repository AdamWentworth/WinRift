name: Bug report
description: Report reproducible incorrect behavior in WinRift.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Owner maintenance form. WinRift does not accept outside contributions. Do not include API keys, private server details, raw match payloads, or player information that is not your own.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Champion guide
        - Champion directory or tier list
        - Summoner profile
        - Live match
        - Win conditions
        - Collector or data pipeline
        - Deployment or monitoring
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route or command
      placeholder: /champions/Irelia or make up-worker
  - type: input
    id: patch
    attributes:
      label: Patch
      placeholder: "16.17"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS or local/container context. Redact private hostnames and addresses.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add screenshots or logs after removing credentials, player identifiers, and private infrastructure details.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private infrastructure details, and player data that is not my own.
          required: true
