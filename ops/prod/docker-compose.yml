services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: winrift_clickhouse
    restart: unless-stopped
    cpus: "1.0"
    cpu_shares: 256
    mem_limit: 3g
    memswap_limit: 4g
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-winrift}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-winrift}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-winrift}
    volumes:
      - ${WINRIFT_CLICKHOUSE_DATA_DIR:-/mnt/storage/clickhouse/data}:/var/lib/clickhouse
      - ${WINRIFT_CLICKHOUSE_HOT_DIR:-/mnt/storage/clickhouse/hot}:/var/lib/clickhouse-hot
      - ${WINRIFT_CLICKHOUSE_LOG_DIR:-/mnt/storage/clickhouse/logs}:/var/log/clickhouse-server
      - ${WINRIFT_CLICKHOUSE_BACKUP_DIR:-/mnt/storage/clickhouse/backups}:/backups
      - ${WINRIFT_CLICKHOUSE_CONFIG_DIR:-/srv/winrift/clickhouse/config.d}/winrift-system-logs.xml:/etc/clickhouse-server/config.d/winrift-system-logs.xml:ro
      - ${WINRIFT_CLICKHOUSE_CONFIG_DIR:-/srv/winrift/clickhouse/config.d}/winrift-root-storage.xml:/etc/clickhouse-server/config.d/winrift-root-storage.xml:ro
      - ${WINRIFT_CLICKHOUSE_CONFIG_DIR:-/srv/winrift/clickhouse/config.d}/winrift-resource-limits.xml:/etc/clickhouse-server/config.d/winrift-resource-limits.xml:ro
      - ${WINRIFT_CLICKHOUSE_USERS_DIR:-/srv/winrift/clickhouse/users.d}/winrift-query-logging.xml:/etc/clickhouse-server/users.d/winrift-query-logging.xml:ro
      - ${WINRIFT_SCHEMA_FILE:-/srv/winrift/schema.sql}:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: ${WINRIFT_CORE_IMAGE:-ghcr.io/adamwentworth/winrift-core:latest}
    container_name: winrift_api
    command: ["/winrift-api"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HTTP_ADDR: :8000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-winrift}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-winrift}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-winrift}
      RIOT_AUTH_FAILURE_MARKER_PATH: /run/winrift/riot-auth-failed
    ports:
      - "${WINRIFT_API_BIND:-127.0.0.1}:${WINRIFT_API_PORT:-8000}:8000"
    volumes:
      - ${WINRIFT_RUNTIME_STATE_DIR:-/srv/winrift/runtime}:/run/winrift
    depends_on:
      clickhouse:
        condition: service_healthy

  web:
    image: ${WINRIFT_WEB_IMAGE:-ghcr.io/adamwentworth/winrift-web:latest}
    container_name: winrift_web
    restart: unless-stopped
    ports:
      - "${WINRIFT_WEB_BIND:-0.0.0.0}:${WINRIFT_WEB_PORT:-8082}:8080"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s

  worker:
    image: ${WINRIFT_CORE_IMAGE:-ghcr.io/adamwentworth/winrift-core:latest}
    container_name: winrift_worker
    command: ["/winrift-worker"]
    # Auth failures exit successfully and remain stopped; unexpected failures
    # receive a small bounded number of automatic recovery attempts.
    restart: on-failure:3
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1536m
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-winrift}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-winrift}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-winrift}
      RIOT_AUTH_FAILURE_MARKER_PATH: /run/winrift/riot-auth-failed
    volumes:
      - ${WINRIFT_RUNTIME_STATE_DIR:-/srv/winrift/runtime}:/run/winrift
    depends_on:
      clickhouse:
        condition: service_healthy

  monitor:
    image: ${WINRIFT_CORE_IMAGE:-ghcr.io/adamwentworth/winrift-core:latest}
    container_name: winrift_monitor
    command: ["/winrift-monitor"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MONITOR_API_HEALTH_URL: http://api:8000/api/health
      RIOT_AUTH_FAILURE_MARKER_PATH: /run/winrift/riot-auth-failed
      MONITOR_WORKER_HEARTBEAT_PATH: /run/winrift/worker-heartbeat.json
      MONITOR_WORKER_CONTAINER_NAME: ${MONITOR_WORKER_CONTAINER_NAME:-winrift_worker}
      MONITOR_DOCKER_SOCKET_PATH: /var/run/docker.sock
      MONITOR_ALERT_STATE_PATH: /run/winrift/monitor-alert-state.json
    volumes:
      - ${WINRIFT_RUNTIME_STATE_DIR:-/srv/winrift/runtime}:/run/winrift
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
